[general]
context=unauthenticated
allowguest=no
udpbindaddr=0.0.0.0:5060
tcpenable=yes
tcpbindaddr=0.0.0.0:5060
transport=udp,tcp
srvlookup=yes
disallow=all
allow=ulaw
allow=alaw
allow=opus
directmedia=no
nat=force_rport,comedia

[karvion-agent]
type=friend
host=dynamic
secret=${SIP_AGENT_SECRET:-karvion_secure_sip_pass}
context=karvion-ivr-inbound
canreinvite=no
dtmfmode=rfc2833
disallow=all
allow=ulaw
allow=alaw
qualify=yes

[karvion-trunk]
type=peer
host=dynamic
secret=${SIP_TRUNK_SECRET:-karvion_trunk_pass}
context=karvion-trunk-incoming
insecure=port,invite
disallow=all
allow=ulaw
