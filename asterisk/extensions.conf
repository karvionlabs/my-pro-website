[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
KARVION_API_URL=http://host.docker.internal:3000/api/voip
KARVION_WEBHOOK_SECRET=karvion_voip_secret_2026

[unauthenticated]
exten => s,1,Hangup(21)

[karvion-ivr-inbound]
exten => s,1,NoOp(--- Karvion Labs Automated Inbound Call: ${CALLERID(num)} ---)
 same => n,Answer()
 same => n,Wait(1)
 ; Dispatch webhook event: CALL_START
 same => n,System(curl -s -X POST -H "Content-Type: application/json" -H "x-voip-signature: ${KARVION_WEBHOOK_SECRET}" -d '{"event":"CALL_START","callId":"${UNIQUEID}","caller":"${CALLERID(num)}","direction":"INBOUND"}' ${KARVION_API_URL} &)
 ; Play welcome prompt
 same => n,Playback(beep)
 same => n,Background(custom/karvion-welcome-ivr)
 same => n,WaitExten(5)

; Option 1: AI Automation & Enterprise Solutions
exten => 1,1,NoOp(Selected Option 1: AI Automation)
 same => n,System(curl -s -X POST -H "Content-Type: application/json" -H "x-voip-signature: ${KARVION_WEBHOOK_SECRET}" -d '{"event":"IVR_SELECTION","callId":"${UNIQUEID}","selection":"1","service":"AI_AUTOMATION"}' ${KARVION_API_URL} &)
 same => n,Playback(auth-thankyou)
 same => n,Hangup()

; Option 2: Education & Tutoring
exten => 2,1,NoOp(Selected Option 2: Education & Tutoring)
 same => n,System(curl -s -X POST -H "Content-Type: application/json" -H "x-voip-signature: ${KARVION_WEBHOOK_SECRET}" -d '{"event":"IVR_SELECTION","callId":"${UNIQUEID}","selection":"2","service":"EDUCATION_TUTORING"}' ${KARVION_API_URL} &)
 same => n,Playback(auth-thankyou)
 same => n,Hangup()

; Option 3: Speak with a Specialist
exten => 3,1,NoOp(Selected Option 3: Specialist Queue)
 same => n,System(curl -s -X POST -H "Content-Type: application/json" -H "x-voip-signature: ${KARVION_WEBHOOK_SECRET}" -d '{"event":"IVR_SELECTION","callId":"${UNIQUEID}","selection":"3","service":"AGENT_QUEUE"}' ${KARVION_API_URL} &)
 same => n,Dial(SIP/karvion-agent,20)
 same => n,Hangup()

; Timeout & Invalid Handlers
exten => t,1,Playback(vm-goodbye)
 same => n,Hangup()

exten => i,1,Playback(pbx-invalid)
 same => n,Goto(s,5)

; Hangup Cleanup Hook
exten => h,1,NoOp(--- Call Terminated: ${UNIQUEID} Duration: ${CDR(duration)}s ---)
 same => n,System(curl -s -X POST -H "Content-Type: application/json" -H "x-voip-signature: ${KARVION_WEBHOOK_SECRET}" -d '{"event":"CALL_END","callId":"${UNIQUEID}","duration":${CDR(duration)},"disposition":"${CDR(disposition)}"}' ${KARVION_API_URL} &)
